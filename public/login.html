<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Latika Residence PMS — Login</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzMiAzMiI+CiAgPHJlY3Qgd2lkdGg9IjMyIiBoZWlnaHQ9IjMyIiByeD0iNiIgZmlsbD0iIzAyOThCMiIvPgogIDx0ZXh0IHg9IjkiIHk9IjI0IiBmb250LWZhbWlseT0iQXJpYWwsIHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMjIiIGZvbnQtd2VpZ2h0PSI4MDAiIGZpbGw9IndoaXRlIj5MPC90ZXh0Pgo8L3N2Zz4=">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F7F8FA;min-height:100vh;display:flex;align-items:center;justify-content:center;}
.card{background:#fff;border-radius:12px;padding:40px;width:100%;max-width:380px;box-shadow:0 4px 24px rgba(0,0,0,0.10);}
.logo-block{display:flex;align-items:center;gap:14px;margin-bottom:32px;}
.logo-sq{width:44px;height:44px;background:#0298B2;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;font-weight:800;}
.logo-text{font-size:16px;font-weight:700;color:#1A1D23;}
.logo-sub{font-size:12px;color:#9299A8;}
h2{font-size:18px;font-weight:700;color:#1A1D23;margin-bottom:6px;}
p{font-size:13px;color:#9299A8;margin-bottom:24px;}
.form-group{margin-bottom:16px;}
label{display:block;font-size:12px;font-weight:500;color:#5A6072;margin-bottom:6px;}
input{width:100%;padding:10px 14px;border:1px solid #E2E5EC;border-radius:8px;font-size:14px;color:#1A1D23;transition:border-color 0.15s;}
input:focus{outline:none;border-color:#0298B2;box-shadow:0 0 0 3px rgba(2,152,178,0.12);}
.btn{width:100%;padding:12px;background:#0298B2;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;margin-top:8px;transition:background 0.15s;}
.btn:hover{background:#017a8f;}
.error{background:#FEE2E2;color:#991b1b;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;display:none;}
.footer{text-align:center;font-size:11px;color:#9299A8;margin-top:24px;}
</style>
</head>
<body>
<div class="card">
  <div class="logo-block">
    <div class="logo-sq">L</div>
    <div>
      <div class="logo-text">Latika Residence</div>
      <div class="logo-sub">Property Management System</div>
    </div>
  </div>
  <h2>Welcome back</h2>
  <p>Sign in to access your PMS</p>
  <div class="error" id="error-msg">Invalid username or password.</div>
  <div class="form-group">
    <label>Username</label>
    <input type="text" id="username" placeholder="admin" autocomplete="username">
  </div>
  <div class="form-group">
    <label>Password</label>
    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
  </div>
  <button class="btn" onclick="login()">Sign In</button>
  <div class="footer">Latika Residence · Siem Reap, Cambodia</div>
</div>
<script>
document.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });

async function login() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const errEl = document.getElementById('error-msg');
  errEl.style.display = 'none';
  if (!username || !password) { errEl.textContent = 'Please enter username and password.'; errEl.style.display = 'block'; return; }
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ username, password }),
    });
    if (res.ok) {
      window.location.href = '/';
    } else {
      errEl.textContent = 'Invalid username or password.';
      errEl.style.display = 'block';
    }
  } catch (e) {
    errEl.textContent = 'Connection error. Please try again.';
    errEl.style.display = 'block';
  }
}
</script>
</body>
</html>
